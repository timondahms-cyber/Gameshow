<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Die große Gameshow – Familie und Pluralisierung</title>
<style>
:root{--bg:#070d2b;--bg2:#12206b;--gold:#f5c542;--txt:#fff;--ok:#1fa34a;--bad:#d1344a;--card:#0e1a55;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070d2b}}
:root[data-theme="dark"]{--bg:#070d2b}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 50% 0,var(--bg2),var(--bg) 70%) var(--bg);color:var(--txt);font-family:"Trebuchet MS",Verdana,sans-serif;min-height:100vh}
.wrap{max-width:1000px;margin:0 auto;padding:12px;display:grid;grid-template-columns:1fr 150px;gap:12px}
@media(max-width:700px){.wrap{grid-template-columns:1fr}.ladder{order:-1;display:flex!important;flex-direction:row-reverse;overflow-x:auto}.ladder div{min-width:90px}}
h1{color:var(--gold);text-align:center;margin:6px 0;font-size:1.5rem;letter-spacing:1px}
.hero{width:100%;border-radius:14px;border:3px solid var(--gold)}
.btn{background:linear-gradient(#f9d86a,#d9a21b);color:#201500;border:0;border-radius:24px;padding:12px 22px;font-weight:700;font-size:1rem;cursor:pointer;margin:4px}
.btn:disabled{opacity:.4;cursor:default}
.center{text-align:center}
.mod{display:flex;gap:10px;align-items:center;background:var(--card);border:2px solid var(--gold);border-radius:16px;padding:10px;margin:8px 0;min-height:96px}
.mod img,.av{width:80px;height:80px;border-radius:50%;object-fit:cover;border:3px solid var(--gold);flex:none;background:#223;font-size:46px;text-align:center;line-height:74px}
.mod b{color:var(--gold);display:block;font-size:.85rem}
.q{background:linear-gradient(#1b2d8f,#0b1650);border:2px solid var(--gold);border-radius:30px;padding:16px;text-align:center;font-size:1.15rem;margin:8px 0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:560px){.opts{grid-template-columns:1fr}}
.opt{background:linear-gradient(#1b2d8f,#0b1650);border:2px solid #8aa0ff;color:#fff;border-radius:26px;padding:12px 16px;text-align:left;font-size:1rem;cursor:pointer;position:relative;overflow:hidden}
.opt:hover:not(:disabled){border-color:var(--gold)}
.opt.sel{background:#c98d0c;border-color:var(--gold)}
.opt.ok{background:var(--ok)}.opt.bad{background:var(--bad)}
.opt.gone{visibility:hidden}
.opt i{color:var(--gold);font-style:normal;font-weight:700;margin-right:8px}
.bar{position:absolute;left:0;bottom:0;height:5px;background:var(--gold)}
.jok{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.jok button{background:var(--card);color:var(--gold);border:2px solid var(--gold);border-radius:30px;padding:8px 14px;cursor:pointer;font-weight:700}
.jok button:disabled{opacity:.35;text-decoration:line-through}
.ladder{display:flex;flex-direction:column;gap:4px}
.ladder div{background:var(--card);border-radius:8px;padding:8px;text-align:center;font-weight:700;color:var(--gold)}
.ladder .cur{background:var(--gold);color:#201500}
.ladder .done{opacity:.5}
.hide{display:none!important}
.wolf{cursor:pointer}
small{opacity:.7}
</style></head><body>

{q:"Wie nennt man es, wenn viele verschiedene Formen des Zusammenlebens anerkannt sind?",o:["Pluralisierung","Digitalisierung","Leo (hat letztes Jahr unseren PB-LK verlassen)","Globalisierung"],a:0,by:"G",ex:"Pluralisierung – es gibt nicht mehr die eine Normalform."},
{q:"Wie wird Familie im Schulbuch beschrieben, weil es keine feste Definition gibt?",o:["Fester Hafen","Moving target","Goldstandard","Naturgesetz"],a:1,by:"S",ex:"Ein „moving target“ – ein bewegliches Ziel."},
{q:"Welche dieser Aufgaben gehört NICHT zu den vier genannten Funktionen der Familie?",o:["Emotionale Funktion","Platzierungsfunktion","Solidarität zwischen den Generationen","Produktionsfunktion"],a:3,by:"G",ex:"Die Produktionsfunktion hat die Familie abgegeben – die anderen drei bleiben."},
{q:"Wie viel Prozent der Bevölkerung lebten 2017 laut Destatis in Familien mit ledigen Kindern?",o:["23 %","29 %","48 %","63 %"],a:2,by:"S",ex:"48 % – die relative Mehrheit, aber nicht die absolute."},
{q:"In welchem Jahr verabschiedete der Bundestag die „Ehe für alle“?",o:["2001","2013","2017","2021"],a:2,by:"G",ex:"Im Sommer 2017."}];
const $=id=>document.getElementById(id);
let i=0,sel=-1,step=0,jUsed={},gone=[],locked=false,next=null;
const rnd=a=>a[Math.floor(Math.random()*a.length)];
function say(w,t){$("mav").src=IMG[w];$("mname").textContent=NAME[w];$("mtext").textContent=t}
function begin(){$("start").classList.add("hide");$("game").classList.remove("hide");$("ladder").classList.remove("hide");
$("ladder").innerHTML=L.map((l,k)=>`<div id="l${k}">${k+1}: ${l}</div>`).reverse().join("");
i=0;jUsed={};["j5","jp","jt"].forEach(x=>$(x).disabled=false);
intro=[["G","Herzlich willkommen zur großen Gameshow! Ich bin Günther!"],["S","Und ich bin Schlauch! Heute dreht sich alles um: Familie und Pluralisierung."],["G","Fünf Fragen, drei Joker – und am Ende wartet die Million!"],["S","Dann nehmen Sie Platz, Kandidat! Die erste Frage kommt sofort."]];
step=0;runIntro()}
let intro;
function runIntro(){$("qbox").classList.add("hide");if(step<intro.length){say(...intro[step]);step++;next=runIntro;show("nxt")}else showQ()}
function show(id){$(id).classList.remove("hide")}
function nextStep(){$("nxt").classList.add("hide");next&&next()}
function showQ(){const q=Q[i];sel=-1;gone=[];locked=false;
document.querySelectorAll(".ladder div").forEach((d,k)=>{d.className=k<i?"done":k==i?"cur":""});
const nm=i==4?"Die MILLIONEN-Frage!":"Frage für "+L[i]+".";
say(q.by,nm+" "+q.q);$("qt").textContent=q.q;
$("opts").innerHTML=q.o.map((t,k)=>`<button class="opt" id="o${k}" onclick="pick(${k})"><i>${"ABCD"[k]}:</i>${t}</button>`).join("");
$("fin").disabled=true;show("qbox");$("nxt").classList.add("hide")}
function pick(k){if(locked)return;sel=k;document.querySelectorAll(".opt").forEach((o,n)=>o.classList.toggle("sel",n==k));$("fin").disabled=false;
const w=Q[i].by=="G"?"S":"G";say(w,"Antwort "+"ABCD"[k]+"? Ist das Ihre endgültige Antwort?")}
function finalAns(){if(sel<0||locked)return;locked=true;$("fin").disabled=true;const q=Q[i],w=q.by=="G"?"S":"G";
say(w,"Die Spannung steigt … Wir blenden kurz die Musik ein … und die Antwort lautet …");
setTimeout(()=>{$("o"+q.a).classList.add("ok");
if(sel==q.a){const wl=i==4;say(w,wl?"RICHTIG! Sie sind MILLIONÄR! "+q.ex:"RICHTIG! "+q.ex);
next=()=>{if(wl)end(true);else{i++;showQ()}};}
else{$("o"+sel).classList.add("bad");
const leo=q.o[sel].startsWith("Leo");
say(w,leo?"Leo?! Der hat letztes Jahr unseren PB-Leistungskurs verlassen – eine Schweigeminute für Leo. 🕯️ Aber richtig ist leider: "+q.o[q.a]:"Leider falsch! Richtig wäre gewesen: "+q.o[q.a]+". "+q.ex);
next=()=>end(false)}
show("nxt")},1800)}
function end(win){$("qbox").classList.add("hide");const safe=i>=3?L[2]:"0 €";
const t=win?"1 MILLION €":safe;
$("mtext").textContent=win?"Herzlichen Glückwunsch – Sie gehen mit 1 MILLION € nach Hause!":"Sie gehen mit "+t+" nach Hause. Danke fürs Mitspielen!";
$("nxt").textContent="Nochmal spielen";show("nxt");next=()=>{$("nxt").textContent="Weiter ▶";begin()}}
function fifty(){if(locked||jUsed.f)return;jUsed.f=1;$("j5").disabled=true;const q=Q[i];
const w=[0,1,2,3].filter(k=>k!=q.a).sort(()=>Math.random()-.5).slice(0,2);
w.forEach(k=>$("o"+k).classList.add("gone"));gone=w;if(sel>=0&&w.includes(sel)){sel=-1;$("fin").disabled=true}
say("S","Der 50:50-Joker! Zwei falsche Antworten verabschieden sich.")}
function pub(){if(locked||jUsed.p)return;jUsed.p=1;$("jp").disabled=true;const q=Q[i];
let v=[0,0,0,0],left=[0,1,2,3].filter(k=>!gone.includes(k));const top=55+Math.floor(Math.random()*25);
v[q.a]=top;let r=100-top;left.filter(k=>k!=q.a).forEach((k,n,arr)=>{const x=n==arr.length-1?r:Math.floor(r*Math.random());v[k]=x;r-=x});
left.forEach(k=>{const b=document.createElement("div");b.className="bar";b.style.width=v[k]+"%";$("o"+k).appendChild(b);$("o"+k).insertAdjacentHTML("beforeend",`<span style="float:right">${v[k]}%</span>`)});
say("G","Das Publikum hat abgestimmt! Die Balken sehen Sie unter den Antworten.")}
function phone(){if(locked||jUsed.t)return;jUsed.t=1;$("jt").disabled=true;const q=Q[i];
const av=$("mav");say("S","Wir rufen Herrn Wolff an …");
const box=$("mtext");
setTimeout(()=>{av.outerHTML=wolfImg?`<img id="mav" class="wolf" src="${wolfImg}" onclick="pickWolf()" alt="Herr Wolff">`:`<div class="av wolf" id="mav" onclick="pickWolf()" title="Foto hochladen">🐺</div>`;
$("mname").textContent="Herr Wolff (am Telefon)";
const ans="ABCD"[q.a];
box.textContent=rnd(["Auuuuh – äh, Wolff hier! Also ich bin mir ziemlich sicher: Antwort "+ans+".","Moment, ich muss kurz das Rudel stumm schalten … Ich tippe klar auf "+ans+"!","Das riecht verdächtig nach "+ans+". Mein Instinkt täuscht mich nie!"]);},1200);}
function pickWolf(){const f=document.createElement("input");f.type="file";f.accept="image/*";f.onchange=()=>{const r=new FileReader();r.onload=()=>{wolfImg=r.result;const a=$("mav");a.outerHTML=`<img id="mav" class="wolf" src="${wolfImg}" onclick="pickWolf()" alt="Herr Wolff">`};r.readAsDataURL(f.files[0])};f.click()}
</script></body></html>
